<style>
:root{
  --bg:oklch(98.2% 0.004 260);
  --surface:oklch(100% 0 0);
  --surface-2:oklch(97% 0.006 260);
  --border:oklch(91% 0.01 260);
  --border-strong:oklch(85% 0.015 260);
  --text:oklch(23% 0.02 265);
  --text-2:oklch(45% 0.02 265);
  --text-3:oklch(62% 0.015 265);
  --accent:oklch(38% 0.10 266);
  --accent-2:oklch(28% 0.09 266);
  --accent-tint:oklch(94% 0.02 266);
  --accent-tint-2:oklch(88% 0.045 266);
  --brand-teal:oklch(49.5% 0.087 223.5);
  --brand-teal-tint:oklch(93% 0.03 223.5);
  --success:oklch(58% 0.14 155);
  --success-tint:oklch(94% 0.05 155);
  --warning:oklch(64% 0.15 65);
  --warning-tint:oklch(94% 0.07 80);
  --danger:oklch(56% 0.20 25);
  --danger-tint:oklch(95% 0.045 25);
  --sidebar-bg:oklch(19% 0.035 266);
  --sidebar-bg-2:oklch(23% 0.04 266);
  --sidebar-text:oklch(72% 0.02 265);
  --sidebar-text-active:oklch(99% 0.004 265);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);}
body{font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--text);}
.font-display{font-family:"Sora",system-ui,sans-serif;}
.tnum{font-variant-numeric:tabular-nums;}
a{color:inherit;text-decoration:none;}
#app{display:flex;height:100vh;min-height:640px;overflow:hidden;}

/* ---- sidebar ---- */
.sidebar{width:224px;flex:none;background:var(--sidebar-bg);height:100%;display:flex;flex-direction:column;padding:18px 12px;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px 8px;}
.brand-text{display:flex;flex-direction:column;line-height:1.2;min-width:0;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:white;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;padding:3px;}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block;}
.brand-name{color:white;font-size:14.5px;font-weight:700;letter-spacing:-0.005em;white-space:normal;}
.navitem{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--sidebar-text);font-size:13.5px;font-weight:500;cursor:pointer;transition:background .12s ease,color .12s ease;}
.navitem:hover{background:oklch(28% 0.03 265);}
.navitem.active{background:var(--accent);color:var(--sidebar-text-active);font-weight:600;}
.navitem svg{flex:none;}
.sidebar-spacer{flex:1;}
.sidebar-foot-link{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;color:var(--sidebar-text);font-size:14px;cursor:pointer;}
.sidebar-foot-link:hover{background:oklch(28% 0.03 265);}
.sidebar-divider{height:1px;background:oklch(32% 0.03 265);margin:14px 4px;}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;}
.sidebar-user-avatar{width:32px;height:32px;border-radius:50%;background:oklch(38% 0.06 266);display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:600;flex:none;}
.sidebar-user-name{color:var(--sidebar-text-active);font-size:13px;font-weight:600;white-space:nowrap;}
.sidebar-user-role{color:var(--sidebar-text);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ---- main column ---- */
.main-col{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;}
.topbar{height:60px;flex:none;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 26px;}
.org-switch{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--border);border-radius:9px;color:var(--text-2);font-size:13px;font-weight:500;cursor:pointer;flex:none;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 14px;width:320px;max-width:30vw;color:var(--text-3);}
.search-box span{font-size:13px;}
.topbar-spacer{flex:1;}
.icon-btn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text-2);cursor:pointer;position:relative;background:transparent;}
.icon-btn:hover{background:var(--surface-2);}
.topbar-divider{width:1px;height:24px;background:var(--border);}
.topbar-user{display:flex;align-items:center;gap:8px;cursor:pointer;}
.topbar-user-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-tint-2);display:flex;align-items:center;justify-content:center;color:var(--accent-2);font-size:11px;font-weight:700;}
.content{flex:1;overflow-y:auto;padding:24px 30px;position:relative;}
.content-inner{max-width:1320px;}

/* ---- headers ---- */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:16px;flex-wrap:wrap;}
.page-title{margin:0 0 4px 0;font-size:22px;font-weight:700;letter-spacing:-0.01em;}
.page-subtitle{margin:0;font-size:13px;color:var(--text-2);}
.page-actions{display:flex;gap:10px;flex:none;}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:14px;cursor:pointer;}
.back-link:hover{color:var(--text);}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;border:none;font-family:inherit;}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn-xs{padding:4px 9px;font-size:11.5px;border-radius:7px;}
.btn-primary{background:var(--accent);color:white;transition:background .12s ease;}
.btn-primary:hover{background:var(--accent-2);}
.btn-success{background:var(--success);color:white;}
.btn-success:hover{background:oklch(50% 0.14 155);}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border-strong);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{background:var(--danger);color:white;}
.btn-danger:hover{background:oklch(48% 0.20 25);}
.btn-danger-ghost{background:var(--surface);color:var(--danger);border:1px solid var(--border-strong);}
.btn-danger-ghost:hover{background:var(--danger-tint);}
.btn-disabled{opacity:.45;pointer-events:none;}
.icon-btn-sq{width:30px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);}
.icon-btn-sq:hover{background:var(--surface-2);}
.icon-btn-sq.success{color:var(--success);border-color:oklch(80% 0.08 155);}
.icon-btn-sq.success:hover{background:var(--success-tint);}
.icon-btn-sq.danger{color:var(--danger);border-color:oklch(82% 0.06 25);}
.icon-btn-sq.danger:hover{background:var(--danger-tint);}

/* ---- cards / tables ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;}
.card-pad-sm{padding:14px 18px;}
.stat-row{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;flex:1;min-width:160px;}
.stat-icon{width:30px;height:30px;border-radius:8px;background:var(--accent-tint);display:flex;align-items:center;justify-content:center;color:var(--accent-2);}
.stat-label{font-size:12.5px;color:var(--text-2);font-weight:500;}
.stat-value{font-size:28px;font-weight:700;letter-spacing:-0.01em;margin:6px 0;}
.small-stat{flex:1;min-width:140px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;cursor:pointer;}
.small-stat.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint);}
.small-stat-label{font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:600;}
.small-stat-value{font-size:21px;font-weight:700;}

table.dt{width:100%;border-collapse:collapse;}
table.dt th{text-align:left;font-size:10.5px;color:var(--text-3);text-transform:uppercase;font-weight:600;padding:10px 11px;background:var(--surface-2);letter-spacing:.02em;}
table.dt td{padding:11px;border-top:1px solid var(--border);font-size:12.5px;vertical-align:middle;}
table.dt tr.row-link{cursor:pointer;}
table.dt tr.row-link:hover td{background:var(--surface-2);}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tablewrap{overflow-x:auto;}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.pill-dot{width:6px;height:6px;border-radius:50%;}
.pill-success{background:var(--success-tint);color:var(--success);}
.pill-warning{background:var(--warning-tint);color:oklch(48% 0.13 65);}
.pill-danger{background:var(--danger-tint);color:var(--danger);}
.pill-accent{background:var(--accent-tint);color:var(--accent-2);}
.pill-neutral{background:var(--surface-2);color:var(--text-2);}

.avatar{border-radius:9px;background:var(--accent-tint-2);display:flex;align-items:center;justify-content:center;color:var(--accent-2);font-weight:700;flex:none;}

.tabs{display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:16px;flex-wrap:wrap;}
.tab{padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:7px;cursor:pointer;}
.tab.active{background:var(--surface);box-shadow:0 1px 3px oklch(20% 0.02 265/0.10);color:var(--text);}
.tab .count{font-size:11px;color:var(--text-3);}
.tab.active .count{background:var(--accent-tint);color:var(--accent-2);padding:1px 7px;border-radius:999px;}

.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;}
.subtab{padding:9px 4px;margin-right:22px;font-size:13px;font-weight:600;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.subtab.active{color:var(--accent);border-color:var(--accent);}

.chip{padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text-2);font-size:12px;font-weight:600;cursor:pointer;}
.chip.active{background:var(--accent-tint);color:var(--accent-2);border-color:transparent;}

input.dc-input, select.dc-input, textarea.dc-input{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:13px;font-weight:600;color:var(--text);background:var(--surface);border:1.5px solid var(--border-strong);border-radius:8px;padding:8px 11px;width:100%;outline:none;}
input.dc-input:focus, select.dc-input:focus, textarea.dc-input:focus{border-color:var(--accent);}
.field-label{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px;display:block;}
.field-note{font-size:11.5px;color:var(--text-3);margin-top:4px;}
.field{margin-bottom:14px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 18px;}
.grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px 18px;}
@media (max-width:900px){ .grid-4{grid-template-columns:1fr 1fr;} }

.toggle{width:36px;height:21px;border-radius:999px;padding:2px;cursor:pointer;background:var(--border-strong);flex:none;transition:background .15s ease;}
.toggle.on{background:var(--accent);}
.toggle-knob{width:17px;height:17px;border-radius:50%;background:white;transition:transform .15s ease;}
.toggle.on .toggle-knob{transform:translateX(15px);}

.modal-backdrop{position:fixed;inset:0;background:oklch(20% 0.02 265 / 0.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal-panel{background:var(--surface);border-radius:16px;width:480px;max-width:92vw;max-height:90vh;overflow-y:auto;box-shadow:0 24px 48px oklch(20% 0.02 265/0.24);}
.modal-panel.lg{width:680px;}
.modal-panel.xl{width:920px;}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:2;}
.modal-title{font-size:15.5px;font-weight:700;}
.modal-body{padding:20px 22px;}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--surface);}
.modal-close{cursor:pointer;color:var(--text-3);width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:var(--surface-2);color:var(--text);}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:oklch(20% 0.02 265);color:white;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 24px oklch(20% 0.02 265/0.3);z-index:200;}

.stepper{display:flex;align-items:center;flex-wrap:wrap;gap:0;}
.step-circle{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:12px;font-weight:700;}
.step-circle.done{background:var(--success);color:white;}
.step-circle.active{background:var(--accent);color:white;}
.step-circle.pending{background:var(--surface-2);color:var(--text-3);border:1px solid var(--border-strong);}
.step-label{font-size:13px;font-weight:600;margin-left:9px;}
.step-line{width:40px;height:2px;background:var(--border-strong);margin:0 12px;}
.step-line.done{background:var(--success);}
.step-item{display:flex;align-items:center;cursor:pointer;}

.section-title{font-size:13px;font-weight:700;color:var(--text);margin:0 0 12px 0;display:flex;align-items:center;gap:8px;}
.section-block{margin-bottom:22px;}
.section-block:last-child{margin-bottom:0;}

.banner{border-radius:10px;padding:12px 16px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.banner-error{background:var(--danger-tint);color:var(--danger);}
.banner-info{background:var(--accent-tint);color:var(--accent-2);}
.banner-success{background:var(--success-tint);color:var(--success);}

.doc-viewer{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;min-height:420px;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:12.5px;flex-direction:column;gap:10px;padding:20px;text-align:center;}

.history-list{display:flex;flex-direction:column;gap:0;}
.history-item{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--border);font-size:12.5px;}
.history-item:first-child{border-top:none;}
.history-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;margin-top:5px;}
.history-time{color:var(--text-3);font-size:11.5px;white-space:nowrap;}

.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.perm-group{border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.perm-group-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:8px;display:flex;justify-content:space-between;}
.perm-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px;color:var(--text-2);}
.perm-row input{accent-color:var(--accent);width:15px;height:15px;}
.link-btn{background:none;border:none;color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;padding:0;font-family:inherit;}

.filter-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px;align-items:end;}
.progress-bar{width:70px;height:6px;border-radius:999px;background:var(--border);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px;}
.progress-fill{height:100%;background:var(--accent);}

::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:oklch(85% 0.01 265);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
.row-hover:hover{background:var(--surface-2);}
.text-muted{color:var(--text-3);}
.mt24{margin-top:24px;}
.mt12{margin-top:12px;}
.mb0{margin-bottom:0;}
.flex{display:flex;}

.wrap{flex-wrap:wrap;}
.between{justify-content:space-between;}

.col{flex-direction:column;}

function fmtMoney(n, ccy){
  ccy = ccy || 'GBP';
  const symbol = ccy==='GBP'?'£':ccy==='EUR'?'€':ccy==='USD'?'$':ccy+' ';
  const neg = n < 0;
  const s = symbol + Math.abs(Number(n)).toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});
  return neg ? '-' + s : s;
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function flashToast(text){
  UI.toast = text;
  if (UI._toastTimer) clearTimeout(UI._toastTimer);
  renderToast();
  UI._toastTimer = setTimeout(() => { UI.toast = null; renderToast(); }, 2400);
}
function renderToast(){
  let el = document.getElementById('toast-el');
  if (UI.toast) {
    if (!el) { el = document.createElement('div'); el.id = 'toast-el'; el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = UI.toast;
  } else if (el) { el.remove(); }
}

/* ---------------- shared small components ---------------- */
function pill(label, tone){
  tone = tone || 'neutral';
  return '<span class="pill pill-'+tone+'">'+escapeHtml(label)+'</span>';
}
function statusPill(status){
  const s = String(status||'').toLowerCase();
  if (['approved','active','completed','ready','connected','delivered','ok','released'].includes(s)) return pill(status,'success');
  if (['pending','pending approval','in progress','onboarding','processing','needs review','validation error(s)','draft'].includes(s)) return pill(status, s==='validation error(s)' ? 'danger' : 'warning');
  if (['rejected','failed','error','disconnected','paused','invalid'].includes(s)) return pill(status,'danger');
  return pill(status,'neutral');
}
function avatar(text, size, bg, fg){
  size = size || 34;
  return '<div class="avatar" style="width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*0.36)+'px;'+(bg?'background:'+bg+';':'')+(fg?'color:'+fg+';':'')+'">'+escapeHtml(text)+'</div>';
}
function progressBar(progressStr){
  // "1 of 2" -> 50%
  const m = /(\d+)\s*of\s*(\d+)/i.exec(progressStr||'');
  let pct = 0, label = progressStr || '';
  if (m) { const done = +m[1], total = +m[2]; pct = total ? Math.round(done/total*100) : 0; label = done + '/' + total; }
  return '<span class="progress-bar"><span class="progress-fill" style="width:'+pct+'%;"></span></span><span class="text-muted" style="font-size:11.5px;">'+escapeHtml(label)+'</span>';
}
function pageHeader(title, subtitle, actionsHtml){
  return '<div class="page-header"><div><h1 class="page-title font-display">' + title + '</h1><p class="page-subtitle">' + (subtitle||'') + '</p></div><div class="page-actions">' + (actionsHtml||'') + '</div></div>';
}
function backLink(hash, label){
  return '<a href="#/' + hash + '" class="back-link">' + icon('chevron_left') + (label||'Back') + '</a>';
}
function fieldBlock(label, value){
  return '<div class="field"><div class="field-label">'+escapeHtml(label)+'</div><div style="font-size:13px;font-weight:600;">'+ (value===''||value==null ? '<span class="text-muted">—</span>' : escapeHtml(value)) +'</div></div>';
}
function toggleHtml(on, action, id, extra){
  return '<div class="toggle'+(on?' on':'')+'" data-action="'+action+'" data-id="'+id+'" '+(extra||'')+'><div class="toggle-knob"></div></div>';
}
function historyList(items){
  if (!items || !items.length) return '<div class="text-muted" style="font-size:12.5px;">No history yet.</div>';
  return '<div class="history-list">' + items.map(h => {
    const parts = String(h).split(' · ');
    return '<div class="history-item"><div class="history-dot"></div><div class="f1">'+escapeHtml(parts[0]||h)+'</div><div class="history-time">'+escapeHtml(parts[1]||'')+'</div></div>';
  }).join('') + '</div>';
}
function modalWrap(id, panelClass, innerHtml){
  return '<div class="modal-backdrop" data-action="'+id+'">' + '<div class="modal-panel '+(panelClass||'')+'">' + innerHtml + '</div></div>';
}

}

function render(){
  const r = currentRoute();
  const app = document.getElementById('app');
  app.innerHTML =
    renderSidebar(r.section) +
    '<div class="main-col">' +
      renderTopbar() +
      '<div class="content"><div class="content-inner">' + pageRouter() + '</div></div>' +
    '</div>';
  renderToast();
  window.scrollTo(0,0);
  const c = app.querySelector('.content'); if (c) c.scrollTop = 0;
}

function rerenderKeepingFocus(){
  const active = document.activeElement;
  let name = null, selStart = null, selEnd = null;
  if (active && active.matches && active.matches('[data-draft],[data-bind]')) {
    name = active.getAttribute('data-draft') || active.getAttribute('data-bind');
    if ('selectionStart' in active) { selStart = active.selectionStart; selEnd = active.selectionEnd; }
  }
  render();
  if (name) {
    const el = document.querySelector('[data-draft="'+name+'"],[data-bind="'+name+'"]');
    if (el) { el.focus(); if (selStart!=null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch(e){} } }
  }
}

function boot(){
  const app = document.getElementById('app');
  app.addEventListener('click', function(e){
    const actionEl = e.target.closest('[data-action]');
    if (!actionEl) return;
    if (actionEl.classList.contains('modal-backdrop') && e.target !== actionEl) return;
    const fn = ACTIONS[actionEl.dataset.action];
    if (fn) { e.preventDefault(); fn(actionEl, e); }
  });
  app.addEventListener('change', function(e){
    const el = e.target.closest('[data-bind]');
    if (!el) return;
    const fn = BINDINGS[el.dataset.bind];
    if (fn) fn(el, e);
  });
  app.addEventListener('input', function(e){
    const el = e.target.closest('[data-draft]');
    if (!el) return;
    const fn = DRAFTS[el.dataset.draft];
    if (fn) fn(el, e);
  });
  window.addEventListener('hashchange', render);
  render();
}

const ACTIONS = {};
const BINDINGS = {};
const DRAFTS = {};

/*__ROUTER_SHELL_INSERT__*/
/* ================= ROUTER ================= */
function pageRouter(){
  const r = currentRoute();
  switch(r.section){
    case 'dashboard': return pageDashboard();
    case 'clients': return r.a ? pageClientDetail(r.a) : pageClients();
    case 'suppliers': return r.a ? pageSupplierDetail(r.a) : pageSuppliers();
    case 'recipients': return pageRecipients();
    case 'invoices': return r.a === 'upload' ? pageInvoiceUpload() : (r.a ? pageInvoiceDetail(r.a) : pageInvoices());
    case 'approvals': return pageApprovals();
    case 'payments':
      if (r.a === 'batch' && r.b) return pageBatchDetail(r.b);
      if (r.a === 'bulk' && r.b) return pageBulkDetail(r.b);
      if (r.a === 'single' && r.b) return pageSinglePaymentDetail(r.b);
      if (r.a === 'noninvoice' && r.b === 'new') return pageNonInvoiceNew();
      if (r.a === 'noninvoice' && r.b) return pageNonInvoiceDetail(r.b);
      return pagePayments(r.a);
    case 'reports': return pageReports();
    case 'logs': return r.a === 'inspect' && r.b ? pageLogs('interfaces') : pageLogs(r.a);
    case 'settings': return pageSettings(r.a);
    default: return pageDashboard();
  }
}

/* ================= DASHBOARD ================= */
function pageDashboard(){
  const pendingInv = DB.invoices.filter(i => i.status === 'pending');
  const pendingBatches = DB.paymentBatches.filter(b => b.status === 'pending');
  const totalVolume = DB.invoices.reduce((s,i) => s + (i.status==='approved'?i.amount:0), 0);
  const errorCount = DB.invoices.filter(i => i.integrationError).length + DB.interfaceLogs.filter(l=>/error|rejected|timeout/i.test(l.businessEvent)).length;

  const widget = pendingInv.slice(0,5).map(inv => (

    '<div class="stat-card"><div class="stat-label">Approved volume (30d)</div><div class="stat-value">'+fmtMoney(totalVolume)+'</div><div class="text-muted" style="font-size:12px;">across '+DB.invoices.filter(i=>i.status==='approved').length+' invoices</div></div>' +
  '</div>' +
  (errorCount ? '<div class="banner banner-error">'+icon('alert')+' '+errorCount+' item(s) need attention — integration or SWIFT errors. <a href="#/logs/interfaces" style="text-decoration:underline;margin-left:4px;">View integration logs</a></div>' : '') +
  '<div class="grid-2" style="align-items:start;">' +

const CLIENT_TABS = ['Organisation','Addresses','Accounts','GL Codes','Tracking Categories','Services','Notifications'];
function pageClientDetail(id){
  const c = findClient(id);
  if (!c) return backLink('clients','Back to clients') + '<div class="card">Client not found.</div>';
  const tab = UI.clientDetailTab[id] || 'Organisation';
  const editing = !!UI.clientEditing[id];
  const draft = editing ? (UI.clientDraft[id] || (UI.clientDraft[id] = JSON.parse(JSON.stringify(c)))) : c;

  const tabsHtml = '<div class="subtabs">' + CLIENT_TABS.map(t => (
    '<div class="subtab'+(t===tab?' active':'')+'" data-action="setClientTab" data-id="'+id+'" data-tab="'+t+'">'+t+'</div>'
  )).join('') + '</div>';

  let body = '';
  if (tab === 'Organisation') body = clientTabOrganisation(c, draft, editing);
  else if (tab === 'Addresses') body = clientTabAddresses(c, draft, editing);
  else if (tab === 'Accounts') body = clientTabAccounts(c, draft, editing);
  else if (tab === 'GL Codes') body = clientTabGLCodes(c, draft, editing);
  else if (tab === 'Tracking Categories') body = clientTabTracking(c, draft, editing);
  else if (tab === 'Services') body = clientTabServices(c, draft, editing);
  else if (tab === 'Notifications') body = clientTabNotifications(c, draft, editing);

  const actionsHtml = editing
    ? '<button class="btn btn-ghost" data-action="cancelClientEdit" data-id="'+id+'">Cancel</button><button class="btn btn-primary" data-action="saveClientEdit" data-id="'+id+'">Save Changes</button>'
    : '<button class="btn btn-ghost" data-action="startClientEdit" data-id="'+id+'">Edit</button>';

  return '' +
  backLink('clients','Back to clients') +
  pageHeader(c.name, 'Client since '+c.onboarded+' · '+statusPill(c.status), actionsHtml) +
  '<div class="card">' + tabsHtml + body + '</div>';
}

    paymentSettings:{invoices:{automaticInvoiceScan:false,invoiceApproval:false},singlePayments:{balanceCheckEnabled:false,fundingRequestEnabled:false,fundingRequestApprover:'1 Line',approvePaymentCancellation:false,requireAttachmentForBatch:false},batchSchedule:{defaultExecutionTime:'14:00',clientTimezone:'Europe/London',currencyOverrides:[]},bulkPayments:{uploadEnabled:false,verifyRequired:false,approveRequired:false,cancellationApprovalRequired:false},bulkSchedule:{defaultExecutionTime:'14:00',clientTimezone:'Europe/London',currencyOverrides:[]}},

function earliestProcessingDate(){
  const d = new Date();
  d.setDate(d.getDate() + 1);
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}

function renderNipLineCard(l, idx, client){
  const clientId = client ? client.id : '';
  const receiverNames = client ? payeeNamesForClient(clientId) : [];
  const accounts = client && l.receiverName ? payeeAccountsFor(clientId, l.receiverName).filter(a => !l.bankCountry || a.bankCountry === l.bankCountry) : [];
  const purposeCodes = l.bankCountry ? PURPOSE_CODES_BY_COUNTRY[l.bankCountry] : null;
  const glCodes = client ? (client.glCodes||[]) : [];
  const taxCodes = client ? (client.taxCodes||DEFAULT_TAX_CODES) : DEFAULT_TAX_CODES;
  const depts = client ? (client.departments||DEFAULT_DEPARTMENTS) : DEFAULT_DEPARTMENTS;
  const bankFieldLabels = {iban:'IBAN', bic:'BIC', branchCode:'Branch Code', bankName:'Bank Name', beneficiaryReference:'Beneficiary Reference'};

  const bankBlock = l.accountNumber ? (
    '<div class="card card-pad-sm" style="background:var(--surface-2);margin-top:10px;"><div class="flex between center">' +
      '<div class="section-title mb0" style="font-size:11.5px;">Bank Details'+(l.accountEditing?'':' <span class="text-muted" style="font-weight:500;text-transform:none;">(auto-populated)</span>')+'</div>' +
      (l.accountEditing ? '' : '<span class="link-btn" data-action="toggleNipAccountEdit" data-line="'+l.id+'">Edit</span>') +
    '</div>' +
    (l.accountEditing
      ? '<div class="grid-3 mt12">' + Object.keys(bankFieldLabels).map(f => '<div class="field" style="margin-bottom:0;"><div class="field-label">'+bankFieldLabels[f]+'</div><input class="dc-input" data-draft="nip_line_'+f+'" data-line="'+l.id+'" value="'+escapeHtml(l[f])+'"></div>').join('') + '</div>'
      : '<div class="grid-3 mt12">' + fieldBlock('IBAN', l.iban) + fieldBlock('BIC', l.bic) + fieldBlock('Branch Code', l.branchCode) + fieldBlock('Bank Name', l.bankName) + fieldBlock('Beneficiary Reference', l.beneficiaryReference) + '</div>'
    ) +
  '</div>') : '';

  const purposeField = purposeCodes && purposeCodes.length
    ? '<select class="dc-input" data-bind="nip_line_purposeSelect" data-line="'+l.id+'"><option value="">Select…</option>'+purposeCodes.map(p=>'<option '+(l.paymentPurpose===p?'selected':'')+'>'+p+'</option>').join('')+'</select>'
    : '<input class="dc-input" data-draft="nip_line_paymentPurpose" data-line="'+l.id+'" value="'+escapeHtml(l.paymentPurpose)+'" placeholder="Enter payment purpose" style="color:var(--text-3);">';

  return '<div class="card section-block">' +
    '<div class="flex between center"><div class="section-title mb0">Payment Line '+(idx+1)+'</div><div class="icon-btn-sq danger" data-action="removeNipLine" data-line="'+l.id+'">'+icon('x')+'</div></div>' +
    '<div class="grid-3 mt12">' +
      '<div class="field"><div class="field-label">Amount</div><input class="dc-input" data-draft="nip_line_amount" data-line="'+l.id+'" value="'+escapeHtml(l.amount)+'" placeholder="0.00"></div>' +
      '<div class="field"><div class="field-label">Receiver / Supplier</div><select class="dc-input" data-bind="nip_line_receiver" data-line="'+l.id+'"><option value="">Select…</option>'+receiverNames.map(n=>'<option '+(l.receiverName===n?'selected':'')+'>'+escapeHtml(n)+'</option>').join('')+'</select></div>' +
      '<div class="field"><div class="field-label">Bank Account Country</div><select class="dc-input" data-bind="nip_line_country" data-line="'+l.id+'" '+(l.receiverName?'':'disabled')+'><option value="">Any</option>'+BANK_COUNTRIES.map(c=>'<option '+(l.bankCountry===c?'selected':'')+'>'+c+'</option>').join('')+'</select></div>' +
    '</div>' +
    '<div class="field"><div class="field-label">Account Number</div><select class="dc-input" data-bind="nip_line_account" data-line="'+l.id+'" '+(l.receiverName?'':'disabled')+'>' +
      '<option value="">'+(l.receiverName?'Select an account…':'Select a receiver first')+'</option>' +
      accounts.map(a=>'<option value="'+a.id+'" '+(l.accountId===a.id?'selected':'')+'>'+a.accountNumber+' · '+a.bankName+' · '+a.currency+'</option>').join('') +
      (l.receiverName ? '<option value="__add_new__">+ Add new account…</option>' : '') +
    '</select></div>' +
    bankBlock +
    '<div class="grid-3 mt12">' +
      '<div class="field"><div class="field-label">Payment Purpose</div>'+purposeField+'</div>' +
      '<div class="field"><div class="field-label">Payment Reference</div><input class="dc-input" data-draft="nip_line_paymentReference" data-line="'+l.id+'" value="'+escapeHtml(l.paymentReference)+'"></div>' +
      '<div class="field"><div class="field-label">Ultimate Beneficiary</div><input class="dc-input" data-draft="nip_line_ultimateBeneficiary" data-line="'+l.id+'" value="'+escapeHtml(l.ultimateBeneficiary)+'"></div>' +
    '</div>' +

    '</div>' +
    '<div class="field" style="margin-bottom:0;"><div class="field-label">BH Department</div><div class="flex gap8" style="flex-wrap:wrap;">' +
      depts.map(d=>'<div class="chip'+(l.departments.includes(d)?' active':'')+'" data-action="toggleNipDept" data-line="'+l.id+'" data-dept="'+escapeHtml(d)+'">'+escapeHtml(d)+'</div>').join('') +
    '</div></div>' +
  '</div>';
}

function renderNonInvoicePostingPanel(n){
  const client = findClient(n.clientId);
  const glCodes = client ? (client.glCodes||[]) : [];
  const taxCodes = client ? (client.taxCodes||DEFAULT_TAX_CODES) : DEFAULT_TAX_CODES;
  const missing = n.lines.filter(l => !l.glCode || !l.taxCode).length;
  const rows = n.lines.map(l => (
    '<tr><td>'+escapeHtml(l.receiverName)+'</td><td class="tnum">'+fmtMoney(+l.amount||0, n.currency)+'</td>' +
    '<td><input class="dc-input" list="dl_pgl_'+l.id+'" data-draft="nipd_glCode" data-nid="'+n.id+'" data-line="'+l.id+'" value="'+escapeHtml(l.glCode)+'" placeholder="Type or select…"><datalist id="dl_pgl_'+l.id+'">'+glCodes.map(g=>'<option value="'+g.code+'">'+escapeHtml(g.desc)+'</option>').join('')+'</datalist></td>' +
    '<td><input class="dc-input" list="dl_ptax_'+l.id+'" data-draft="nipd_taxCode" data-nid="'+n.id+'" data-line="'+l.id+'" value="'+escapeHtml(l.taxCode)+'" placeholder="Type or select…"><datalist id="dl_ptax_'+l.id+'">'+taxCodes.map(t=>'<option value="'+t.code+'">'+escapeHtml(t.desc)+'</option>').join('')+'</datalist></td></tr>'
  )).join('');
  return '<div class="banner banner-error">'+icon('alert')+' Not posted to accounting — '+missing+' line(s) still missing a GL or tax code.</div>' +
    '<div class="card section-block"><div class="section-title">Assign GL &amp; Tax Codes</div><div class="tablewrap"><table class="dt"><thead><tr><th>Receiver</th><th>Amount</th><th>GL Code</th><th>Tax Code</th></tr></thead><tbody>'+rows+'</tbody></table></div>' +
    '<button class="btn btn-primary mt12" data-action="postNonInvoiceToAccounting" data-id="'+n.id+'" '+(missing?'disabled':'')+'>'+icon('upload')+'Post to Accounting</button></div>';
}

ACTIONS.openCreateBatch = () => { UI.createBatchModal = { clientId:'', accountId:'', releaseDate:'', selected:{} }; render(); };
ACTIONS.closeCreateBatch = () => { UI.createBatchModal = null; render(); };
BINDINGS.cb_clientId = (el) => { UI.createBatchModal.clientId = el.value; UI.createBatchModal.accountId=''; UI.createBatchModal.selected={}; render(); };
BINDINGS.cb_accountId = (el) => { UI.createBatchModal.accountId = el.value; render(); };
DRAFTS.cb_releaseDate = (el) => { UI.createBatchModal.releaseDate = el.value; };
BINDINGS.cb_select = (el) => { UI.createBatchModal.selected[el.dataset.id] = el.checked; render(); };
ACTIONS.submitCreateBatch = () => {
  const m = UI.createBatchModal;
  if (!m.clientId || !m.accountId) { flashToast('Select a client and account first'); return; }
  const client = findClient(m.clientId); const account = client.accounts.find(a=>a.id===m.accountId);
  const selIds = Object.keys(m.selected).filter(k=>m.selected[k]);
  if (!selIds.length) { flashToast('Select at least one invoice to include'); return; }
  const invoices = selIds.map(id => findInvoice(id));
  const id = 'BB-'+Math.floor(Math.random()*9000+1000)+'-'+ (new Date()).toISOString().slice(0,10).replace(/-/g,'') +'-0'+ (DB.paymentBatches.length+1);
  DB.paymentBatches.unshift({ id, client: client.name, clientId: client.id, bankName: account.accountName, currency: account.currency,
    totalAmount: invoices.reduce((s,i)=>s+i.amount,0), beneficiaries: invoices.length, approvalProgress:'0 of 2', releaseStatus:'Pending release',
    cutOffTime: client.paymentSettings.batchSchedule.defaultExecutionTime, createdAt: 'just now', status:'pending',
    invoices: invoices.map(inv => ({ invoiceRef: inv.supplierInvoiceNumber, beneficiary: inv.supplier, bankAccount: inv.bankAccount, sortCode: '—', dueDate: inv.dueDate, amountToPay: inv.amount, purposeOfPayment:'Trade invoice', additionalInfo:'' })),
    history:['Created by Dipankar Haldar · just now'], attachments:[], approvalNotes:'' });
  UI.createBatchModal = null; flashToast('Payment batch created'); navigate('#/payments/batch/'+id);

ACTIONS.submitNonInvoicePayment = () => {
  const m = UI.nonInvoiceNew;
  if (!m.clientId || !m.accountId || !m.currency) { flashToast('Client, currency and debit account are required'); return; }
  if (m.lines.some(l => !l.amount || !(+l.amount>0) || !l.receiverName || !l.accountNumber)) { flashToast('Each payment line needs an amount, receiver and account'); return; }
  const client = findClient(m.clientId);
  const account = client.accounts.find(a => a.id === m.accountId);
  const posted = m.lines.every(l => l.glCode && l.taxCode);
  const totalAmount = m.lines.reduce((s,l) => s + (+l.amount||0), 0);
  const seq = 32 + DB.nonInvoicePayments.length;
  const id = 'NIP-2026-'+String(seq).padStart(4,'0');
  DB.nonInvoicePayments.unshift({
    id, clientId:client.id, client:client.name, currency:m.currency, debitAccountId:m.accountId, debitAccountLabel: account ? account.accountName : '—',
    processingDate:m.processingDate||'—', attachment:m.attachment, status:'pending', approvalProgress:'0 of 2', posted, postedAt: posted?'just now':null,
    totalAmount, createdBy:'Dipankar Haldar', createdAt:'just now',
    lines: m.lines.map(l => Object.assign({}, l)),
    history: ['Created by Dipankar Haldar · just now'].concat(posted ? ['Posted to accounting · just now'] : []),
  });
  UI.nonInvoiceNew = null;
  flashToast('Non-invoice payment submitted' + (posted ? '' : ' — accounting posting pending'));
  navigate('#/payments/noninvoice/'+id);
};

/* ---- Settings actions/bindings/drafts ---- */
ACTIONS.setSettingsTab = (el) => { UI.settingsTab = el.dataset.tab; navigate('#/settings/'+el.dataset.tab); };
function blankRoleDraft(){ return { name:'', description:'', privileges:{ navigation:[], invoice:[], bulkPayments:[], serviceUsers:[], recipients:[] } }; }
ACTIONS.openAddRole = () => { UI.roleModal = { id:null, draft: blankRoleDraft() }; render(); };
ACTIONS.openEditRole = (el) => { const r = findRole(el.dataset.id); UI.roleModal = { id:r.id, draft: JSON.parse(JSON.stringify(r)) }; render(); };
ACTIONS.closeRoleModal = () => { UI.roleModal = null; render(); };
ACTIONS.deleteRole = (el) => { const i = DB.roles.findIndex(r=>r.id===el.dataset.id); if (i>-1) DB.roles.splice(i,1); flashToast('Role deleted'); render(); };
DRAFTS.role_name = (el) => { UI.roleModal.draft.name = el.value; };
DRAFTS.role_description = (el) => { UI.roleModal.draft.description = el.value; };
ACTIONS.togglePerm = (el) => {
  const group = el.dataset.group, opt = el.dataset.opt; const arr = UI.roleModal.draft.privileges[group];
  const i = arr.indexOf(opt); if (i>-1) arr.splice(i,1); else arr.push(opt);
};
ACTIONS.permSelectAll = (el) => {
  const group = el.dataset.group; const opts = PERM_GROUPS.find(g=>g[0]===group)[2];
  UI.roleModal.draft.privileges[group] = UI.roleModal.draft.privileges[group].length === opts.length ? [] : opts.slice();
  render();
};
ACTIONS.submitRoleModal = () => {
  const m = UI.roleModal;
  if (!m.draft.name.trim()) { flashToast('Role name is required'); return; }
  if (m.id) { Object.assign(findRole(m.id), m.draft); flashToast('Role updated'); }
  else { m.draft.id = nextId('role'); DB.roles.push(m.draft); flashToast('Role created'); }
  UI.roleModal = null; render();
};

function blankApprovalConfigDraft(){ return { entityType:'Invoice', approvalType:'Single approval', status:'Active', steps:[{level:1,name:'Approver 1',approverType:'Client User'}] }; }
ACTIONS.openCreateApprovalConfig = () => { UI.approvalConfigModal = { id:null, draft: blankApprovalConfigDraft() }; render(); };
ACTIONS.openApprovalConfig = (el) => { const a = findApprovalConfig(el.dataset.id); UI.approvalConfigModal = { id:a.id, draft: JSON.parse(JSON.stringify(a)) }; render(); };
ACTIONS.closeApprovalConfigModal = () => { UI.approvalConfigModal = null; render(); };
BINDINGS.apc_entityType = (el) => { UI.approvalConfigModal.draft.entityType = el.value; };
BINDINGS.apc_approvalType = (el) => { UI.approvalConfigModal.draft.approvalType = el.value; };
ACTIONS.addApprovalStep = () => { const steps = UI.approvalConfigModal.draft.steps; steps.push({level:steps.length+1, name:'Approver '+(steps.length+1), approverType:'Client User'}); render(); };
ACTIONS.removeApprovalStep = (el) => { UI.approvalConfigModal.draft.steps.splice(+el.dataset.idx,1); render(); };
ACTIONS.setApprovalStepType = (el) => { UI.approvalConfigModal.draft.steps[+el.dataset.idx].approverType = el.value; };
ACTIONS.submitApprovalConfigModal = () => {
  const m = UI.approvalConfigModal;
  if (m.id) { Object.assign(findApprovalConfig(m.id), m.draft); flashToast('Approval setup updated'); }
  else { m.draft.id = nextId('apc'); DB.approvalConfigs.push(m.draft); flashToast('Approval setup created'); }

};

ACTIONS.setIntegrationsTab = (el) => { UI.integrationsTab = el.dataset.tab; render(); };
ACTIONS.toggleAccountingStatus = (el) => { const a = DB.integrations.accountingSystems.find(x=>x.id===el.dataset.id); a.status = a.status==='Connected'?'Disconnected':'Connected'; render(); };

DRAFTS.sw_host = (el) => { UI.swiftModal.draft.host = el.value; };
DRAFTS.sw_port = (el) => { UI.swiftModal.draft.port = el.value; };
DRAFTS.sw_username = (el) => { UI.swiftModal.draft.username = el.value; };

ACTIONS.closeMapModal = () => { UI.mapModal = null; render(); };

DRAFTS.map_tenantId = (el) => { UI.mapModal.draft.tenantId = el.value; };

  if (m.id) Object.assign(findMapConfig(m.id), m.draft); else { m.draft.id = nextId('map'); DB.integrations.mapConfigs.push(m.draft); }

/* ================= LOGS ================= */
function pageLogs(sub){
  const tab = sub || UI.logs.tab || 'notif';
  UI.logs.tab = tab;
  const tabsHtml = '<div class="tabs">' +
    '<div class="tab'+(tab==='notif'?' active':'')+'" data-action="setLogsTab" data-tab="notif">'+icon('bell')+'Notification Logs</div>' +
    '<div class="tab'+(tab==='interfaces'?' active':'')+'" data-action="setLogsTab" data-tab="interfaces">'+icon('link')+'Interfaces Log</div>' +
  '</div>';
  let body = '';
  if (tab === 'notif') {
    const rows = DB.notifications.map(n => (
      '<tr><td>'+pill(n.channel,'accent')+'</td><td>'+escapeHtml(n.recipient)+'</td><td>'+escapeHtml(n.subject)+'</td><td class="text-muted">'+escapeHtml(n.sent)+'</td><td>'+statusPill(n.status)+'</td></tr>'
    )).join('');
    body = '<div class="card" style="padding:0;"><div class="tablewrap"><table class="dt"><thead><tr><th>Channel</th><th>Recipient</th><th>Subject / Message</th><th>Sent</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  } else {
    const rows = DB.interfaceLogs.map(l => (
      '<tr class="row-link" data-action="openLogInspector" data-id="'+l.id+'">' +
        '<td class="text-muted">'+escapeHtml(l.timestamp)+'</td><td style="font-weight:600;">'+escapeHtml(l.interfacingApp)+'</td><td>'+escapeHtml(l.transactionType)+'</td>' +
        '<td>'+escapeHtml(l.entityType)+'</td><td>'+escapeHtml(l.entityReference)+'</td>' +
        '<td>'+(/error|rejected|timeout/i.test(l.businessEvent) ? pill(l.businessEvent,'danger') : pill(l.businessEvent,'success'))+'</td>' +
        '<td><span class="link-btn">Inspect</span></td>' +
      '</tr>'
    )).join('');
    body = '<div class="card" style="margin-bottom:14px;"><div class="filter-bar">' +
        '<div><div class="field-label">Interfacing App</div><input class="dc-input" placeholder="e.g. Xero, HSBCNet"></div>' +
        '<div><div class="field-label">Transaction Type</div><input class="dc-input" placeholder="e.g. GL Sync"></div>' +
        '<div><div class="field-label">Entity Type</div><input class="dc-input" placeholder="e.g. Invoice"></div>' +
        '<div><div class="field-label">Entity Reference</div><input class="dc-input" placeholder="e.g. INV-2061"></div>' +
      '</div></div>' +
      '<div class="card" style="padding:0;"><div class="tablewrap"><table class="dt"><thead><tr><th>Timestamp</th><th>Interfacing App</th><th>Transaction Type</th><th>Entity Type</th><th>Entity Reference</th><th>Business Event</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>' +
      (UI.logInspector ? renderLogInspector() : '');
  }
  return pageHeader('Integration Logs', 'Notification history and interface / connector activity across Epic Investment Partners.', '<button class="btn btn-ghost">'+icon('download')+'Export CSV</button>') + tabsHtml + body;
}
function renderLogInspector(){
  const l = findInterfaceLog(UI.logInspector);
  return modalWrap('closeLogInspector','lg','' +
    '<div class="modal-head"><div class="modal-title">Inspect Integration Log Payloads</div><div class="modal-close" data-action="closeLogInspector">'+icon('x')+'</div></div>' +
    '<div class="modal-body">' +
      '<div class="grid-2">'+fieldBlock('Interfacing App', l.interfacingApp)+fieldBlock('Transaction Type', l.transactionType)+fieldBlock('Entity Type', l.entityType)+fieldBlock('Entity Reference', l.entityReference)+'</div>' +
      '<div class="field-label mt12">Payload</div>' +
      '<div class="card card-pad-sm" style="background:var(--surface-2);font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;">'+escapeHtml(l.payload)+'</div>' +
      '<button class="btn btn-xs btn-ghost mt12" data-action="copyLogPayload">'+icon('copy')+'Copy</button>' +
    '</div>' +
    '<div class="modal-foot">'+(/error|rejected|timeout/i.test(l.businessEvent) ? '<button class="btn btn-ghost" data-action="retryLogInterface" data-id="'+l.id+'">'+icon('refresh')+'Retry request</button>' : '')+'<button class="btn btn-primary" data-action="closeLogInspector">Close Inspector</button></div>' +
  '');
}

/* ---- Logs actions ---- */
ACTIONS.setLogsTab = (el) => { UI.logs.tab = el.dataset.tab; navigate('#/logs/'+el.dataset.tab); };
ACTIONS.openLogInspector = (el) => { UI.logInspector = el.dataset.id; render(); };
ACTIONS.closeLogInspector = () => { UI.logInspector = null; render(); };
ACTIONS.copyLogPayload = () => flashToast('Payload copied to clipboard');
ACTIONS.retryLogInterface = (el) => { const l = findInterfaceLog(el.dataset.id); l.businessEvent = 'Retried — succeeded'; flashToast('Interface request retried'); render(); };

boot();
